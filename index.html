<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetingHub - Meeting Management Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --dark: #1f2937;
            --light: #f9fafb;
            --border: #e5e7eb;
            --text: #374151;
            --text-light: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--light);
            color: var(--text);
            overflow-x: hidden;
        }

        /* Dark Mode */
        body.dark-mode {
            background: #0f172a;
            color: #e2e8f0;
            --light: #1e293b;
            --text: #e2e8f0;
            --text-light: #cbd5e1;
            --border: #334155;
        }

        .container-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: all 0.3s ease;
        }

        body.dark-mode .sidebar {
            background: #1e293b;
            border-right-color: var(--border);
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            font-weight: 700;
            font-size: 20px;
            color: var(--primary);
        }

        .logo svg {
            width: 28px;
            height: 28px;
        }

        .nav-section {
            margin-bottom: 28px;
        }

        .nav-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 12px;
            padding: 0 12px;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text);
            transition: all 0.2s ease;
            margin-bottom: 6px;
            user-select: none;
            font-size: 14px;
        }

        .nav-item:hover {
            background: var(--light);
            color: var(--primary);
        }

        .nav-item.active {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            font-weight: 500;
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            background: var(--light);
        }

        /* Header */
        .header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        body.dark-mode .header {
            background: #1e293b;
            border-bottom-color: var(--border);
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-left p {
            font-size: 13px;
            color: var(--text-light);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            transition: all 0.2s ease;
            position: relative;
        }

        .icon-btn:hover {
            background: var(--light);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
        }

        .notification-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .user-profile:hover {
            background: var(--light);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        /* Page Content */
        .page-content {
            padding: 32px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Login Page */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        }

        .login-card {
            background: white;
            border-radius: 12px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .login-header p {
            color: var(--text-light);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
            background: white;
            color: var(--text);
        }

        body.dark-mode .form-group input,
        body.dark-mode .form-group select {
            background: #334155;
            border-color: #475569;
            color: #e2e8f0;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #f3f4f6;
            border-color: var(--primary);
        }

        .btn-danger {
            background: #fee2e2;
            color: var(--danger);
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .btn-success {
            background: #dcfce7;
            color: var(--secondary);
        }

        .btn-success:hover {
            background: #bbf7d0;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            justify-content: center;
            border-radius: 8px;
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 24px;
            transition: all 0.2s ease;
        }

        body.dark-mode .card {
            background: #1e293b;
            border-color: #334155;
        }

        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
        }

        /* Dashboard Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        body.dark-mode .stat-card {
            background: #1e293b;
            border-color: #334155;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 24px;
        }

        .stat-icon.primary {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        .stat-icon.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--secondary);
        }

        .stat-icon.warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .stat-icon.danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .stat-content h3 {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .stat-content p {
            font-size: 28px;
            font-weight: 700;
        }

        /* Tables */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--light);
            border-bottom: 1px solid var(--border);
        }

        body.dark-mode thead {
            background: #334155;
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-light);
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        tbody tr:hover {
            background: var(--light);
            cursor: pointer;
        }

        body.dark-mode tbody tr:hover {
            background: #334155;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            align-items: center;
            gap: 4px;
        }

        .badge-scheduled {
            background: rgba(59, 130, 246, 0.1);
            color: var(--info);
        }

        .badge-ongoing {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
        }

        .badge-completed {
            background: rgba(16, 185, 129, 0.1);
            color: var(--secondary);
        }

        .badge-cancelled {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        body.dark-mode .modal-content {
            background: #1e293b;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--light);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .tab-button {
            padding: 12px 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            position: relative;
            bottom: -1px;
        }

        .tab-button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-button:hover {
            color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Calendar */
        .calendar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        body.dark-mode .calendar {
            background: #1e293b;
            border-color: #334155;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .calendar-header h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .calendar-nav {
            display: flex;
            gap: 8px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day-header {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-light);
            padding: 12px;
            text-transform: uppercase;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            position: relative;
        }

        .calendar-day:hover {
            border-color: var(--primary);
            background: var(--light);
        }

        .calendar-day.today {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        .calendar-day.other-month {
            color: var(--text-light);
            opacity: 0.5;
        }

        .calendar-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
        }

        /* Form Styles */
        .form-section {
            margin-bottom: 32px;
        }

        .form-section h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: all 0.2s ease;
            background: white;
            color: var(--text);
        }

        body.dark-mode .textarea {
            background: #334155;
            border-color: #475569;
            color: #e2e8f0;
        }

        .textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Pagination */
        .pagination {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-top: 32px;
        }

        .pagination button {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.dark-mode .pagination button {
            background: #334155;
            border-color: #475569;
        }

        .pagination button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pagination button.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
                position: relative;
                padding: 16px;
            }

            .main-content {
                margin-left: 0;
                margin-top: 0;
            }

            .page-content {
                padding: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .header-right {
                width: 100%;
                justify-content: space-between;
            }

            .table-container {
                font-size: 12px;
            }

            th, td {
                padding: 10px 8px;
            }

            .login-card {
                padding: 32px 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        .slide-in {
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .mt-1 { margin-top: 8px; }
        .mt-2 { margin-top: 16px; }
        .mt-3 { margin-top: 24px; }
        .mt-4 { margin-top: 32px; }

        .mb-1 { margin-bottom: 8px; }
        .mb-2 { margin-bottom: 16px; }
        .mb-3 { margin-bottom: 24px; }
        .mb-4 { margin-bottom: 32px; }

        .gap-1 { gap: 8px; }
        .gap-2 { gap: 16px; }
        .gap-3 { gap: 24px; }

        .flex {
            display: flex;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flex-col {
            flex-direction: column;
        }

        .w-full {
            width: 100%;
        }

        .cursor-pointer {
            cursor: pointer;
        }

        /* Status Indicator */
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-scheduled {
            background: var(--info);
        }

        .status-ongoing {
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        .status-completed {
            background: var(--secondary);
        }

        .status-cancelled {
            background: var(--danger);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-light);
            margin-bottom: 24px;
        }

        /* Loading */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Search */
        .search-box {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;

        function renderCalendarPage() {
            const currentDate = new Date();
            const currentMonth = currentDate.getMonth();
            const currentYear = currentDate.getFullYear();
            
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const prevLastDay = new Date(currentYear, currentMonth, 0).getDate();
            
            const startDate = firstDay.getDay();
            const endDate = lastDay.getDate();
            
            const monthName = currentDate.toLocaleString('id-ID', { month: 'long', year: 'numeric' });
            
            let calendarDays = '';
            const dayHeaders = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
            
            dayHeaders.forEach(day => {
                calendarDays += `<div class="calendar-day-header">${day}</div>`;
            });
            
            // Previous month days
            for (let i = startDate - 1; i >= 0; i--) {
                calendarDays += `<div class="calendar-day other-month">${prevLastDay - i}</div>`;
            }
            
            // Current month days
            for (let i = 1; i <= endDate; i++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const isToday = dateStr === new Date().toISOString().split('T')[0];
                const hasMeeting = appState.meetings.some(m => m.meetingDate === dateStr);
                
                calendarDays += `<div class="calendar-day ${isToday ? 'today' : ''} ${hasMeeting ? 'has-event' : ''}" onclick="selectCalendarDate('${dateStr}')">${i}</div>`;
            }
            
            // Next month days
            const remainingDays = 42 - (startDate + endDate);
            for (let i = 1; i <= remainingDays; i++) {
                calendarDays += `<div class="calendar-day other-month">${i}</div>`;
            }
            
            return `
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
                    <div class="card">
                        <div class="calendar-header">
                            <h3>${monthName}</h3>
                            <div class="calendar-nav">
                                <button class="btn btn-secondary btn-sm" onclick="previousMonth()">← Sebelumnya</button>
                                <button class="btn btn-secondary btn-sm" onclick="nextMonth()">Selanjutnya →</button>
                            </div>
                        </div>
                        <div class="calendar-grid">
                            ${calendarDays}
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Events</h3>
                        </div>
                        <div id="calendarEvents">
                            <div style="color: var(--text-light); text-align: center; padding: 20px;">Pilih tanggal untuk melihat detail</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============ EVENT HANDLERS ============
        function attachEventListeners() {
            // Login form
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
            }

            // Book meeting form
            const bookForm = document.getElementById('bookMeetingForm');
            if (bookForm) {
                bookForm.addEventListener('submit', handleBookMeeting);
            }

            // Search and filter
            const searchMeeting = document.getElementById('searchMeeting');
            if (searchMeeting) {
                searchMeeting.addEventListener('input', handleSearchMeetings);
            }

            const filterStatus = document.getElementById('filterStatus');
            if (filterStatus) {
                filterStatus.addEventListener('change', handleFilterMeetings);
            }

            // Chart
            if (appState.currentPage === 'dashboard') {
                setTimeout(renderStatsChart, 100);
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;

            const user = appState.users.find(u => u.email === email && u.password === password && u.role === role);

            if (user) {
                appState.currentUser = user;
                appState.currentPage = 'dashboard';
                render();
            } else {
                alert('Email atau password salah!');
            }
        }

        function handleBookMeeting(e) {
            e.preventDefault();

            const title = document.getElementById('meetingTitle').value;
            const date = document.getElementById('meetingDate').value;
            const startTime = document.getElementById('meetingStartTime').value;
            const endTime = document.getElementById('meetingEndTime').value;
            const room = document.getElementById('meetingRoom').value;
            const link = document.getElementById('meetingLink').value;
            const desc = document.getElementById('meetingDesc').value;

            const selectedParticipants = Array.from(document.querySelectorAll('.participant-checkbox:checked'))
                .map(cb => parseInt(cb.value));

            const newMeeting = {
                id: appState.meetings.length + 1,
                title,
                description: desc,
                meetingDate: date,
                startTime,
                endTime,
                room,
                onlineLink: link,
                organizerId: appState.currentUser.id,
                status: 'scheduled',
                participants: [appState.currentUser.id, ...selectedParticipants],
                notes: null
            };

            appState.meetings.push(newMeeting);
            alert('Meeting berhasil dibuat!');
            navigateTo('dashboard');
        }

        function handleSearchMeetings(e) {
            const query = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('tbody tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        }

        function handleFilterMeetings(e) {
            const status = e.target.value;
            const rows = document.querySelectorAll('tbody tr');
            
            rows.forEach(row => {
                if (!status) {
                    row.style.display = '';
                } else {
                    row.style.display = row.textContent.includes(status.charAt(0).toUpperCase() + status.slice(1)) ? '' : 'none';
                }
            });
        }

                                    <h5 style="font-weight: 700; margin-bottom: 8px;">Poin Pembahasan</h5>
                                    <ul style="margin-left: 20px; font-size: 14px;">
                                        ${meeting.notes.discussionPoints.map(p => `<li>${p}</li>`).join('')}
                                    </ul>
                                </div>
                                <div style="background: var(--light); padding: 16px; border-radius: 8px;">
                                    <h5 style="font-weight: 700; margin-bottom: 8px;">Keputusan</h5>
                                    <ul style="margin-left: 20px; font-size: 14px;">
                                        ${meeting.notes.decisions.map(d => `<li>${d}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                        ` : `
                            <div style="border-top: 1px solid var(--border); padding-top: 20px;">
                                ${meeting.status === 'completed' ? `
                                    <button class="btn btn-primary" onclick="createMeetingNotes(${meeting.id})">Buat Notulen Meeting</button>
                                ` : ''}
                            </div>
                        `}
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
        }

        function createMeetingNotes(meetingId) {
            alert('Fitur pembuatan notulen akan ditampilkan di form modal');
        }

        function selectCalendarDate(dateStr) {
            const meetings = appState.meetings.filter(m => m.meetingDate === dateStr);
            const eventsContainer = document.getElementById('calendarEvents');
            
            if (meetings.length === 0) {
                eventsContainer.innerHTML = `<div style="color: var(--text-light); text-align: center; padding: 20px;">Tidak ada meeting pada tanggal ini</div>`;
            } else {
                eventsContainer.innerHTML = meetings.map(m => `
                    <div style="padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer;" onclick="renderMeetingDetail(${m.id})">
                        <div style="font-weight: 600; font-size: 14px; margin-bottom: 4px;">${m.title}</div>
                        <div style="font-size: 12px; color: var(--text-light);">${m.startTime} - ${m.endTime}</div>
                        <div style="font-size: 12px; color: var(--text-light); margin-top: 4px;">${m.room}</div>
                    </div>
                `).join('');
            }
        }

        function toggleDarkMode() {
            appState.darkMode = !appState.darkMode;
            localStorage.setItem('darkMode', appState.darkMode);
            document.body.classList.toggle('dark-mode');
            render();
        }

        function logout() {
            if (confirm('Apakah Anda yakin ingin logout?')) {
                appState.currentUser = null;
                appState.currentPage = 'login';
                render();
            }
        }

        function previousMonth() {
            alert('Fitur navigasi bulan akan diimplementasikan');
        }

        function nextMonth() {
            alert('Fitur navigasi bulan akan diimplementasikan');
        }

        function exportMeetingsPDF() {
            alert('Fitur export PDF akan diimplementasikan dengan library pdfkit');
        }

        function exportMeetingsExcel() {
            alert('Fitur export Excel akan diimplementasikan dengan library xlsx');
        }

        function exportAttendanceList() {
            alert('Fitur export attendance akan diimplementasikan');
        }

        function renderStatsChart() {
            const canvas = document.getElementById('statsChart');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            
            // Dummy data untuk 12 bulan terakhir
            const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const data = [4, 5, 3, 7, 6, 8, 5, 9, 7, 6, 8, 10];

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Meeting per Bulan',
                        data: data,
                        borderColor: 'var(--primary)',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        tension: 0.3,
                        fill: true,
                        pointBackgroundColor: 'var(--primary)',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                usePointStyle: true,
                                font: { size: 12, weight: '600' }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 10
                        }
                    }
                }
            });
        }

        // ============ INITIALIZATION ============
        document.addEventListener('DOMContentLoaded', () => {
            if (appState.darkMode) {
                document.body.classList.add('dark-mode');
            }
            render();
        });
    </script>
</body>
</html>
